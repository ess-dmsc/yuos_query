[project]
name = "yuos-query"
version = "0.2.0"
description = "Python wrapper for querying the ESS user office system"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.12"
dependencies = [
    "gql<4",
    "requests>=2.32.5",
    "requests-toolbelt>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
yuos-query = "yuos_query.yuos:cli"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "ecdc-pypi"
url = "https://artifactory.esss.lu.se/artifactory/api/pypi/ecdc-pypi/simple"
publish-url = "https://artifactory.esss.lu.se/artifactory/api/pypi/ecdc-pypi"
default = true
