workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

variables:
  UV_VERSION: "0.10"
  PYTHON_VERSION: "3.14"
  BASE_LAYER: trixie-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

default:
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

stages:
  - check
  - test
  - release

checks:
  stage: check
  script:
    - uvx ruff check
    - uvx ruff format --check

unit_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  script:
    - uv run pytest tests/

coverage:
  stage: test
  script:
    - uv run pytest tests/ --cov=yuos_query --cov-report term --cov-report xml:coverage.xml --junitxml=test-output.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - coverage.xml
      - test-output.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: test-output.xml

publish_package:
  stage: release
  script:
    - uv version $CI_COMMIT_TAG
    - uv build
    - export UV_PUBLISH_USERNAME="ecdc"
    - export UV_PUBLISH_PASSWORD="$ESS_ARTIFACTORY_ECDC_PYPI_TOKEN"
    - uv publish --index ecdc-pypi
  rules:
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script: echo "Running the release job for the new tag."
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release description'
  rules:
    - if: $CI_COMMIT_TAG
