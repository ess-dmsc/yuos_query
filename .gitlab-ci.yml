workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  UV_VERSION: "0.10"
  PYTHON_VERSION: "3.14"
  BASE_LAYER: trixie-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

default:
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

stages:
  - check
  - test
  - publish

checks:
  stage: check
  script:
    - uvx ruff check
    - uvx ruff format --check

unit-tests:
  stage: test
  script:
    - uv run pytest tests/ --cov=yuos_query --cov-report term --cov-report xml:coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

publish:
  stage: publish
  script:
    - uv version $CI_COMMIT_TAG
    - uv build
    - export UV_PUBLISH_USERNAME="ecdc"
    - export UV_PUBLISH_PASSWORD="$ESS_ARTIFACTORY_ECDC_PYPI_TOKEN"
    - uv publish --index ecdc-pypi
  rules:
    - if: $CI_COMMIT_TAG
